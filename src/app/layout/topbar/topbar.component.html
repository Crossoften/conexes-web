<!-- src/app/layout/topbar/topbar.component.html -->
<header class="topbar">

  <div class="topbar__breadcrumb" aria-label="Localização atual">
    @if (parentLabel()) {
      <span class="topbar__breadcrumb-parent">{{ parentLabel() }}</span>
      <svg class="topbar__sep" viewBox="0 0 16 16" fill="none"
           width="14" height="14" aria-hidden="true">
        <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    }
    <span class="topbar__breadcrumb-current">{{ currentLabel() }}</span>
  </div>

  <div class="topbar__actions">

    <button class="topbar__btn" type="button" disabled title="Em breve" aria-label="Buscar (em breve)">
      <svg viewBox="0 0 20 20" fill="none" width="16" height="16" aria-hidden="true">
        <circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>

    <button class="topbar__btn topbar__btn--notif" type="button" disabled title="Em breve" aria-label="Notificações (em breve)">
      <svg viewBox="0 0 20 20" fill="none" width="16" height="16" aria-hidden="true">
        <path d="M10 2a6 6 0 0 0-6 6v3l-1.5 2.5h15L16 11V8a6 6 0 0 0-6-6z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M8 16.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>

    <div class="topbar__divider" aria-hidden="true"></div>

    <div class="topbar__user">
      <button class="topbar__avatar" type="button"
              (click)="toggleMenu()"
              [attr.aria-expanded]="menuOpen()"
              aria-haspopup="menu"
              [attr.aria-label]="'Menu do usuário' + (auth.user()?.name ? ' — ' + auth.user()?.name : '')">
        {{ auth.userInitials() }}
      </button>

      @if (menuOpen()) {
        <div class="topbar__menu" role="menu">
          <div class="topbar__menu-header">
            <span class="topbar__menu-name">{{ auth.user()?.name || 'Usuário' }}</span>
            @if (auth.user()?.email) {
              <span class="topbar__menu-email">{{ auth.user()?.email }}</span>
            }
          </div>
          <button class="topbar__menu-item topbar__menu-item--danger" type="button"
                  role="menuitem" (click)="logout()">
            <svg viewBox="0 0 20 20" fill="none" width="16" height="16" aria-hidden="true">
              <path d="M13 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 10h9m0 0l-3-3m3 3l-3 3"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Sair
          </button>
        </div>
      }
    </div>

  </div>
</header>
