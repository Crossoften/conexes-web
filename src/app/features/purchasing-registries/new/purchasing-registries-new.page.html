<div class="page">

  <div class="page-header">
    <h1 class="page-title">{{ isEdit() ? 'Editar produto/serviço' : 'Cadastro de produtos e serviços' }}</h1>
  </div>

  <div class="card">

    <div class="card-header">
      <h2 class="card-title">Dados Gerais – Produtos</h2>
      <p class="card-subtitle">Preencha todas as informações necessárias.</p>
    </div>

    <div class="card-body">

      @if (errorMsg()) {
        <div class="form-alert form-alert--error">{{ errorMsg() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-grid">

          <div class="form-row grid-cols-4">
            <div class="form-group">
              <label>Nome do produto<span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="name" [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched">
            </div>

            <div class="form-group">
              <label>Tipo<span class="req">*</span></label>
              <div class="select-wrap">
                <select class="form-control" formControlName="type">
                  <option value="Product">Produto</option>
                  <option value="Service">Serviço</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Fabricante</label>
              <!-- CMP-05: fabricante cadastrado (com criação rápida) -->
              <div style="display:flex; gap:6px; align-items:center;">
                <div class="select-wrap" style="flex:1;">
                  <select class="form-control" formControlName="manufacturerId">
                    <option value="">Selecione</option>
                    @for (m of manufacturers(); track m.id) { <option [value]="m.id">{{ m.name }}</option> }
                  </select>
                  <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <button type="button" class="btn-outline btn-outline--orange" title="Cadastrar fabricante" (click)="quickCreateManufacturer()" style="padding:8px 12px;">+</button>
              </div>
            </div>

            <div class="form-group">
              <label>Grupo</label>
              <!-- CMP-04: grupo de produtos cadastrado (com criação rápida) -->
              <div style="display:flex; gap:6px; align-items:center;">
                <div class="select-wrap" style="flex:1;">
                  <select class="form-control" formControlName="groupId">
                    <option value="">Selecione</option>
                    @for (g of productGroups(); track g.id) { <option [value]="g.id">{{ g.name }}</option> }
                  </select>
                  <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <button type="button" class="btn-outline btn-outline--orange" title="Cadastrar grupo" (click)="quickCreateGroup()" style="padding:8px 12px;">+</button>
              </div>
            </div>
          </div>

          <div class="form-row grid-cols-4">
            <div class="form-group">
              <label>Tipo Medida</label>
              <!-- CMP-06: unidades pré-cadastradas (com opção de digitar via datalist) -->
              <input type="text" class="form-control" list="unidades-medida" placeholder="Ex: UN, KG, L" formControlName="measure">
              <datalist id="unidades-medida">
                @for (u of unidadesMedida; track u) { <option [value]="u"></option> }
              </datalist>
            </div>

            <div class="form-group">
              <label>Valor custo base</label>
              <input type="number" step="0.01" class="form-control" placeholder="0,00" formControlName="costBase">
            </div>

            <div class="form-group">
              <label>Origem</label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="origin">
            </div>

            <div class="form-group">
              <label>Conta Padrão</label>
              <div class="select-wrap">
                <select class="form-control" formControlName="accountPlanId">
                  <option value="">Selecione</option>
                  @for (a of accountPlans(); track a.id) { <option [value]="a.id">{{ a.name }}</option> }
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>
          </div>

          <div class="form-row grid-cols-4">
            <div class="form-group">
              <label>Status</label>
              <div class="select-wrap">
                <select class="form-control" formControlName="status">
                  <option value="Active">Ativo</option>
                  <option value="Pending">Pendente</option>
                  <option value="Inactive">Inativo</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>
          </div>

          <div class="form-row grid-cols-1">
            <div class="form-group">
              <label>Descrição do produto</label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="description">
            </div>
          </div>

        </div>
      </form>
    </div>

    <div class="card-footer">
      <button type="button" class="btn-outline btn-outline--orange" routerLink="/purchasing-registries">Voltar</button>

      <div class="footer-actions-right">
        <button type="button" class="btn-outline btn-outline--orange" (click)="resetForm()" [disabled]="saving()">Limpar campos</button>
        <button type="button" class="btn-solid btn-solid--orange" (click)="onSubmit()" [disabled]="saving()">{{ saving() ? 'Salvando…' : 'Salvar' }}</button>
      </div>
    </div>

  </div>
</div>
