<div class="page">

  <div class="page-header">
    <h1 class="page-title">Cadastro de produtos e serviços</h1>
  </div>

  <div class="card">
    
    <div class="card-header">
      <h2 class="card-title">Dados Gerais – Produtos</h2>
      <p class="card-subtitle">Preencha todas as informações necessárias.</p>
    </div>

    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        
        <div class="form-grid">
          
          <div class="form-row grid-cols-4">
            <div class="form-group">
              <label>Nome do produto<span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="productName" [class.is-invalid]="form.get('productName')?.invalid && form.get('productName')?.touched">
            </div>
            
            <div class="form-group">
              <label>Fabricante<span class="req">*</span></label>
              <div class="select-wrap">
                <select class="form-control" formControlName="manufacturer" [class.is-invalid]="form.get('manufacturer')?.invalid && form.get('manufacturer')?.touched">
                  <option value="">Selecione</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Grupo<span class="req">*</span></label>
              <div class="select-wrap">
                <select class="form-control" formControlName="group" [class.is-invalid]="form.get('group')?.invalid && form.get('group')?.touched">
                  <option value="">Selecione</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Tipo Medida<span class="req">*</span></label>
              <div class="select-wrap">
                <select class="form-control" formControlName="measureType" [class.is-invalid]="form.get('measureType')?.invalid && form.get('measureType')?.touched">
                  <option value="">Selecione</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>
          </div>

          <div class="form-row grid-cols-4">
            <div class="form-group col-span-2">
              <label>Valor custo base</label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="baseCost">
            </div>

            <div class="form-group">
              <label>Origem</label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="origin">
            </div>

            <div class="form-group">
              <label>Selecionar Conta Padrão</label>
              <div class="select-wrap">
                <select class="form-control" formControlName="defaultAccount">
                  <option value="">Selecione</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>
          </div>

          <div class="form-row grid-cols-1">
            <div class="form-group">
              <label>Descrição do produto</label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="description">
            </div>
          </div>

        </div>

      </form>
    </div>

    <div class="card-footer">
      <button class="btn-outline btn-outline--orange" routerLink="/purchasing-registries">
        Voltar
      </button>

      <div class="footer-actions-right">
        <button type="button" class="btn-outline btn-outline--orange" (click)="resetForm()">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <polyline points="3 3 3 8 8 8"></polyline>
            <rect x="10" y="10" width="4" height="4" rx="1"></rect>
          </svg>
          Reiniciar formulário
        </button>

        <button type="submit" class="btn-solid btn-solid--orange" (click)="onSubmit()">
          Salvar
        </button>
      </div>
    </div>

  </div>
</div>
