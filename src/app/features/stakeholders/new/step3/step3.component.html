<!-- src/app/features/stakeholders/new/step3/step3.component.html -->
<!-- FORN-fix: a seção de impostos/retenções saiu do cadastro de fornecedor (agora só
     na tela de Tributos e retenções). Restou apenas a seção de dados de contato. -->
@if (section() === 'contato') {
<div class="step" [formGroup]="$any(form())">

  <!-- Seção: Dados de contato -->
  <div class="sub-section">
    <h3 class="sub-title">Dados de contato</h3>

    <div class="field" [class.field--error]="isInvalid('contactName')">
      <label class="field-label">Nome do contato</label>
      <input class="input" type="text" placeholder="Digite o nome do contato..." formControlName="contactName">
      @if (isInvalid('contactName')) {
        <span class="field-error">Campo obrigatório</span>
      }
    </div>

    <div class="form-row form-row--3">
      <div class="field">
        <label class="field-label">Telefone principal</label>
        <input class="input" type="text" placeholder="(00) 00000-0000" formControlName="contactPhone"
          (input)="applyPhoneMask($event, 'contactPhone')"
          (keydown)="onlyNumbers($event)">
      </div>
      <div class="field">
        <label class="field-label">Telefone celular</label>
        <input class="input" type="text" placeholder="(00) 00000-0000" formControlName="contactMobile"
          (input)="applyPhoneMask($event, 'contactMobile')"
          (keydown)="onlyNumbers($event)">
      </div>
      <div class="field" [class.field--error]="isInvalid('contactEmail')">
        <label class="field-label">E-mail de contato</label>
        <input class="input" type="email" placeholder="email@exemplo.com" formControlName="contactEmail">
        @if (isInvalid('contactEmail')) {
          <span class="field-error">E-mail inválido</span>
        }
      </div>
    </div>

    <div class="field">
      <label class="field-label">Observações</label>
      <input class="input" type="text" placeholder="Digite aqui..." formControlName="observations">
    </div>

  </div>

</div>
}
