<!-- src/app/features/stakeholders/new/stakeholder-new.page.html -->
<div class="new-page">

  <!-- Cabeçalho -->
  <div class="page-header">
    <h1 class="page-title">Cadastro de contato</h1>
  </div>

  <!-- CF-07: fluxo contínuo — sem numeração de etapas; seções empilhadas -->
  <div class="flow-content">
    <app-step1 [form]="step1Form" />
    <app-step2 [form]="step2Form" />
    <app-step3 [form]="step3Form" />
  </div>

  <!-- Mensagem de erro (validação de blocos ou falha ao salvar) -->
  @if (errorMsg()) {
    <div class="form-error-banner">{{ errorMsg() }}</div>
  }

  <!-- Rodapé fixo -->
  <div class="page-footer">
    <button class="btn-back" (click)="back()">Voltar</button>

    <div class="footer-right">
      <button class="btn-draft" (click)="saveDraft()">
        <svg viewBox="0 0 20 20" fill="none" width="16" height="16">
          <path d="M4 14v2h12v-2M10 3v10M7 10l3 3 3-3"
                stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Salvar rascunho
      </button>
      <button class="btn-next" (click)="finalize()">
        Finalizar cadastro
      </button>
    </div>
  </div>

</div>
