<div class="page">
  <div class="page-header">
    <h1 class="page-title">Cadastro de usuários e permissões</h1>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Cadastro de usuário</h2>
      <p class="card-subtitle">Dados do usuário</p>
    </div>

    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-grid">
          
          <div class="form-row grid-cols-3">
            <div class="form-group">
              <label>Nome<span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="firstName" [class.is-invalid]="form.get('firstName')?.invalid && form.get('firstName')?.touched">
            </div>
            <div class="form-group">
              <label>Sobrenome<span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="lastName" [class.is-invalid]="form.get('lastName')?.invalid && form.get('lastName')?.touched">
            </div>
            <div class="form-group">
              <label>CPF<span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="cpf" [class.is-invalid]="form.get('cpf')?.invalid && form.get('cpf')?.touched">
            </div>
          </div>

          <div class="form-row grid-cols-4">
            <div class="form-group">
              <label>Empresa<span class="req">*</span></label>
              <div class="select-wrap"><select class="form-control" formControlName="company"><option value="">Selecione</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            </div>
            <div class="form-group">
              <label>Cargo<span class="req">*</span></label>
              <div class="select-wrap"><select class="form-control" formControlName="role"><option value="">Selecione</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            </div>
            <div class="form-group">
              <label>Área<span class="req">*</span></label>
              <div class="select-wrap"><select class="form-control" formControlName="area"><option value="">Selecione</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            </div>
            <div class="form-group">
              <label>Tel celular<span class="req">*</span></label>
              <div class="select-wrap"><select class="form-control" formControlName="cellphone"><option value="">Selecione</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            </div>
          </div>

          <div class="form-row grid-cols-3">
            <div class="form-group">
              <label>E-mail<span class="req">*</span></label>
              <input type="email" class="form-control" placeholder="Digite aqui..." formControlName="email">
            </div>
            <div class="form-group">
              <label>Usuário<span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="username">
            </div>
            <div class="form-group">
              <label>Perfil de Permissões<span class="req">*</span></label>
              <div class="select-wrap"><select class="form-control" formControlName="permissionProfile"><option value="">Selecione</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            </div>
          </div>

        </div>
      </form>
    </div>

    <div class="card-footer">
      <button class="btn-outline btn-outline--orange" routerLink="/users">Voltar</button>
      <div class="footer-actions-right">
        <button type="button" class="btn-outline btn-outline--orange" (click)="resetForm()">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline><rect x="10" y="10" width="4" height="4" rx="1"></rect></svg>
          Reiniciar formulário
        </button>
        <button type="submit" class="btn-solid btn-solid--orange" (click)="onSubmit()">Próximo</button>
      </div>
    </div>
  </div>
</div>
