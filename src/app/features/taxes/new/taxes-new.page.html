<div class="page">

  <div class="page-header">
    <h1 class="page-title">Cadastro de impostos e retenções</h1>
  </div>

  <div class="card">
    
    <div class="card-header">
      <h2 class="card-title">Dados do Serviço</h2>
      <p class="card-subtitle">Preencha todas as informações necessárias.</p>
    </div>

    <div class="card-body">
      <form [formGroup]="form">
        
        <div class="form-grid mb-6">
          <div class="form-row grid-cols-3">
            <div class="form-group">
              <label>Fornecedor<span class="req">*</span></label>
              <div class="select-wrap">
                <select class="form-control" formControlName="fornecedor" [class.is-invalid]="form.get('fornecedor')?.invalid && form.get('fornecedor')?.touched">
                  <option value="">Selecione</option>
                  <option value="1">Fornecedor A</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Código de Classificação do Serviço<span class="req">*</span></label>
              <div class="select-wrap">
                <select class="form-control" formControlName="codigoServico" [class.is-invalid]="form.get('codigoServico')?.invalid && form.get('codigoServico')?.touched">
                  <option value="">Selecione</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Título do Serviço<span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="tituloServico" [class.is-invalid]="form.get('tituloServico')?.invalid && form.get('tituloServico')?.touched">
            </div>
          </div>
        </div>

        <div class="segmented-tabs mb-6">
          <button type="button" class="segmented-tab-btn" [class.active]="activeTab === 'CONFIG'" (click)="setTab('CONFIG')">
            Configuração de Retenção de Impostos
          </button>
          <button type="button" class="segmented-tab-btn" [class.active]="activeTab === 'ALIQUOTAS'" (click)="setTab('ALIQUOTAS')">
            Alíquotas
          </button>
          <button type="button" class="segmented-tab-btn" [class.active]="activeTab === 'SERVICOS'" (click)="setTab('SERVICOS')">
            Serviços
          </button>
        </div>

        @if (activeTab === 'CONFIG') {
          <h3 class="section-title">Configuração de Retenção de Impostos</h3>
          <div class="form-grid">
            
            <div class="form-row grid-cols-1">
              <div class="form-group">
                <label>Buscar por Natureza da Operação</label>
                <div class="search-wrap-full">
                  <input type="text" class="form-control search-input-pl" placeholder="Buscar" formControlName="naturezaOperacao">
                </div>
              </div>
            </div>

            <div class="form-row grid-cols-1 mt-2">
              <label class="checkbox-inline">
                <div class="checkbox">
                  <input type="checkbox" class="checkbox__input" formControlName="definirAlíquotasManual">
                  <span class="checkbox__box"></span>
                </div>
                Definir Alíquotas Manualmente
              </label>
            </div>

            <div class="form-row grid-cols-4 mt-2">
              <div class="form-group col-span-1">
                <label>Resumo / Total das Retenções</label>
                <input type="text" class="form-control disabled-bg" formControlName="resumoRetencoes">
              </div>
            </div>

          </div>
        }

        @if (activeTab === 'ALIQUOTAS') {
          <h3 class="section-title">Alíquotas</h3>
          <div class="light-bg-box">
            <div class="form-grid">
              
              <div class="form-row grid-cols-4">
                <div class="form-group"><label>Alíquota % IRRF</label><input type="text" class="form-control" placeholder="%" formControlName="aliqIRRF"></div>
                <div class="form-group"><label>Cód. IRRF</label><div class="select-wrap"><select class="form-control" formControlName="codIRRF"><option value="">Sem código</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
                <div class="form-group"><label>Alíquota % PIS</label><input type="text" class="form-control" placeholder="% Digite" formControlName="aliqPIS"></div>
                <div class="form-group"><label>Cód. PIS</label><div class="select-wrap"><select class="form-control" formControlName="codPIS"><option value="">Sem código</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
              </div>

              <div class="form-row grid-cols-4">
                <div class="form-group"><label>Alíquota % PCC</label><input type="text" class="form-control" placeholder="%" formControlName="aliqPCC"></div>
                <div class="form-group"><label>Cód. PCC</label><div class="select-wrap"><select class="form-control" formControlName="codPCC"><option value="">Sem código</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
                <div class="form-group"><label>Alíquota % COFINS</label><input type="text" class="form-control" placeholder="% Digite" formControlName="aliqCOFINS"></div>
                <div class="form-group"><label>Cód. COFINS</label><div class="select-wrap"><select class="form-control" formControlName="codCOFINS"><option value="">Sem código</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
              </div>

              <div class="form-row grid-cols-4">
                <div class="form-group"><label>Alíquota % INSS</label><input type="text" class="form-control" placeholder="%" formControlName="aliqINSS"></div>
                <div class="form-group"><label>Cód. INSS</label><div class="select-wrap"><select class="form-control" formControlName="codINSS"><option value="">Sem código</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
                <div class="form-group"><label>Alíquota % CSLL</label><input type="text" class="form-control" placeholder="% Digite" formControlName="aliqCSLL"></div>
                <div class="form-group"><label>Cód. CSLL</label><div class="select-wrap"><select class="form-control" formControlName="codCSLL"><option value="">Sem código</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
              </div>

              <div class="form-row grid-cols-4">
                <div class="form-group"><label>Alíquota % ISS</label><input type="text" class="form-control" placeholder="%" formControlName="aliqISS"></div>
                <div class="form-group"><label>Cód. ISS</label><div class="select-wrap"><select class="form-control" formControlName="codISS"><option value="">Sem código</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
                <div class="form-group"><label>Alíquota % IBS</label><input type="text" class="form-control" placeholder="%" formControlName="aliqIBS"></div>
                <div class="form-group"><label>Cód. IBS</label><div class="select-wrap"><select class="form-control" formControlName="codIBS"><option value="">Sem código</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
              </div>

              <div class="form-row grid-cols-4">
                <div class="form-group"><label>Alíquota % CBS</label><input type="text" class="form-control" placeholder="%" formControlName="aliqCBS"></div>
                <div class="form-group"><label>Cód. CBS</label><div class="select-wrap"><select class="form-control" formControlName="codCBS"><option value="">Sem código</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
              </div>

            </div>
          </div>
        }

        @if (activeTab === 'SERVICOS') {
          <h3 class="section-title">Serviços</h3>
          <div class="form-grid">
            
            <div class="form-row grid-cols-4">
              <div class="form-group">
                <label>Nome<span class="req">*</span></label>
                <div class="select-wrap"><select class="form-control" formControlName="servNome"><option value="">Selecione</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              </div>
              <div class="form-group">
                <label>Descrição<span class="req">*</span></label>
                <div class="select-wrap"><select class="form-control" formControlName="servDescricao"><option value="">Selecione</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              </div>
              <div class="form-group">
                <label>Código Externo<span class="req">*</span></label>
                <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="servCodExterno">
              </div>
              <div class="form-group">
                <label>Orgão Concessor<span class="req">*</span></label>
                <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="servOrgao">
              </div>
            </div>

            <div class="form-row grid-cols-1">
              <div class="form-group">
                <label>Esse serviço possui redenção?</label>
                <div class="select-wrap"><select class="form-control" formControlName="servRedencao"><option value="">Selecione</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              </div>
            </div>

            <div class="form-row grid-cols-1">
              <div class="form-group">
                <label>Esse serviço está vinculado a qual órgão concessor, centro de custo, projeto, atividade?</label>
                <div class="select-wrap"><select class="form-control" formControlName="servVinculo"><option value="">Selecione</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              </div>
            </div>

          </div>
        }

      </form>
    </div>

    <div class="card-footer">
      <button class="btn-outline btn-outline--orange" routerLink="/taxes">
        Voltar
      </button>

      <div class="footer-actions-right">
        <button type="button" class="btn-outline btn-outline--orange" (click)="resetForm()">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <polyline points="3 3 3 8 8 8"></polyline>
            <rect x="10" y="10" width="4" height="4" rx="1"></rect>
          </svg>
          Reiniciar formulário
        </button>

        <button type="button" class="btn-solid btn-solid--orange" (click)="onNextOrSubmit()">
          @if (activeTab === 'SERVICOS') { Salvar } @else { Próximo }
        </button>
      </div>
    </div>

  </div>
</div>
