<div class="page">

  <div class="page-header">
    <h1 class="page-title">Cadastrar os Orgãos Concessores da Parceria</h1>
  </div>

  <div class="card">
    
    <div class="card-header">
      <h2 class="card-title">Dados Gerais do concessor</h2>
      <p class="card-subtitle">Preencha todas as informações necessárias para cadastrar uma nova entidade/filial.</p>
    </div>

    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        
        <div class="form-grid mb-8">
          
          <div class="form-row grid-cols-2">
            <div class="form-group">
              <label class="flex-label">
                CPNJ<span class="req">*</span>
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="info-icon"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
              </label>
              <div class="select-wrap">
                <select class="form-control" formControlName="cnpj" [class.is-invalid]="form.get('cnpj')?.invalid && form.get('cnpj')?.touched">
                  <option value="">00.000.000/0001-00</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Razão Social <span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="Digite Aqui a Inscrição Estadual da Entidade" formControlName="razaoSocial" [class.is-invalid]="form.get('razaoSocial')?.invalid && form.get('razaoSocial')?.touched">
            </div>
          </div>

          <div class="form-row grid-cols-2">
            <div class="form-group">
              <label>Nome Fantasia <span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="nomeFantasia" [class.is-invalid]="form.get('nomeFantasia')?.invalid && form.get('nomeFantasia')?.touched">
            </div>
            <div class="form-group">
              <label>Emancipação</label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="emancipacao">
            </div>
          </div>

          <div class="form-row grid-cols-4">
            <div class="form-group">
              <label>CEP<span class="req">*</span></label>
              <div class="select-wrap">
                <select class="form-control" formControlName="cep" [class.is-invalid]="form.get('cep')?.invalid && form.get('cep')?.touched"><option value="">Selecione</option></select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>
            <div class="form-group">
              <label>Endereço<span class="req">*</span></label>
              <div class="select-wrap">
                <select class="form-control" formControlName="endereco" [class.is-invalid]="form.get('endereco')?.invalid && form.get('endereco')?.touched"><option value="">Selecione</option></select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>
            <div class="form-group">
              <label>Nro<span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="nro" [class.is-invalid]="form.get('nro')?.invalid && form.get('nro')?.touched">
            </div>
            <div class="form-group">
              <label>Complemento</label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="complemento">
            </div>
          </div>

          <div class="form-row grid-cols-4">
            <div class="form-group">
              <label>Orgão gestor<span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="orgaoGestor" [class.is-invalid]="form.get('orgaoGestor')?.invalid && form.get('orgaoGestor')?.touched">
            </div>
            <div class="form-group">
              <label>Telefone celular</label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="telefoneCelular">
            </div>
            <div class="form-group col-span-2">
              <label>Email</label>
              <input type="email" class="form-control" placeholder="Digite aqui..." formControlName="email">
            </div>
          </div>

        </div>

        <div class="upload-section mt-8">
          <h3 class="section-title">Logotipo do concessor</h3>
          <p class="section-subtitle" style="margin-bottom: 12px; color: var(--text-primary); font-weight: 500;">Alterar Logotipo do concessor</p>
          
          <div class="upload-area">
            <svg viewBox="0 0 24 24" fill="none" width="24" height="24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </div>
        </div>

      </form>
    </div>

    <div class="card-footer">
      <button class="btn-outline btn-outline--orange" routerLink="/agencies">
        Voltar
      </button>

      <div class="footer-actions-right">
        <button type="button" class="btn-outline btn-outline--orange" (click)="onSaveDraft()">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          Salvar rascunho
        </button>

        <button type="submit" class="btn-solid btn-solid--orange" (click)="onSubmit()">
          Salvar
        </button>
      </div>
    </div>

  </div>
</div>
