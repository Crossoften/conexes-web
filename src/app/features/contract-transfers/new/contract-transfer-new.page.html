<div class="page">

  <div class="page-header">
    <h1 class="page-title">Contratos - Repasses e informações da Parceria</h1>
  </div>

  <div class="card">
    
    <div class="card-header">
      <h2 class="card-title">Nova parceria</h2>
      <p class="card-subtitle">Preencha todas as informações necessárias.</p>
    </div>

    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        
        <div class="segmented-tabs mb-6">
          <button type="button" class="segmented-tab-btn" [class.active]="activeTab === 'DADOS'" (click)="setTab('DADOS')">
            Dados gerais
          </button>
          <button type="button" class="segmented-tab-btn" [class.active]="activeTab === 'CONTAS'" (click)="setTab('CONTAS')">
            Inclusão contas a pagar
          </button>
          <button type="button" class="segmented-tab-btn" [class.active]="activeTab === 'ANEXOS'" (click)="setTab('ANEXOS')">
            Anexos
          </button>
        </div>

        @if (activeTab === 'DADOS') {
          <div class="form-grid">
            
            <div class="form-row grid-cols-2">
              <div class="form-group">
                <label>Concessor<span class="req">*</span></label>
                <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="concessor" [class.is-invalid]="form.get('concessor')?.invalid && form.get('concessor')?.touched">
              </div>
              <div class="form-group">
                <label>Entidade<span class="req">*</span></label>
                <input type="text" class="form-control" placeholder="Informe CNPJ ou Razão Social" formControlName="entidade" [class.is-invalid]="form.get('entidade')?.invalid && form.get('entidade')?.touched">
              </div>
            </div>

            <div class="form-row grid-cols-4">
              <div class="form-group">
                <label>Tipo de Contratualização<span class="req">*</span></label>
                <div class="select-wrap"><select class="form-control" formControlName="tipoContratualizacao" [class.is-invalid]="form.get('tipoContratualizacao')?.invalid && form.get('tipoContratualizacao')?.touched"><option value="">Selecione</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              </div>
              <div class="form-group">
                <label>Gestor da Parceria<span class="req">*</span></label>
                <div class="select-wrap"><select class="form-control" formControlName="gestorParceria" [class.is-invalid]="form.get('gestorParceria')?.invalid && form.get('gestorParceria')?.touched"><option value="">Selecione</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              </div>
              <div class="form-group"><label>Data início</label><input type="text" class="form-control" placeholder="00/00/0000" formControlName="dataInicio"></div>
              <div class="form-group"><label>Data término</label><input type="text" class="form-control" placeholder="00/00/0000" formControlName="dataTermino"></div>
            </div>

            <div class="form-row grid-cols-4">
              <div class="form-group"><label>Data assinatura</label><input type="text" class="form-control" placeholder="00/00/0000" formControlName="dataAssinatura"></div>
              <div class="form-group"><label>Nro processo administrativo</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="nroProcessoAdmin"></div>
              <div class="form-group"><label>Nro termo</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="nroTermo"></div>
              <div class="form-group"><label>Nro dispensa</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="nroDispensa"></div>
            </div>

            <div class="form-row grid-cols-3">
              <div class="form-group"><label>Data impressão do anexo</label><input type="text" class="form-control" placeholder="00/00/0000" formControlName="dataImpressaoAnexo1"></div>
              <div class="form-group"><label>Data limite</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="dataLimite1"></div>
              <div class="form-group"><label>Tipo de validação lançamento</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="tipoValidacao1"></div>
            </div>

            <div class="form-row grid-cols-3">
              <div class="form-group"><label>Data impressão do anexo</label><input type="text" class="form-control" placeholder="00/00/0000" formControlName="dataImpressaoAnexo2"></div>
              <div class="form-group"><label>Data limite</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="dataLimite2"></div>
              <div class="form-group"><label>Tipo de validação lançamento</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="tipoValidacao2"></div>
            </div>

            <div class="form-row grid-cols-3">
              <div class="form-group"><label>Valor Recurso Municipal</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="valorRecursoMunicipal"></div>
              <div class="form-group"><label>Valor Recurso Estadual</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="valorRecursoEstadual"></div>
              <div class="form-group"><label>Valor Recurso Federal</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="valorRecursoFederal"></div>
            </div>

            <div class="form-row grid-cols-3">
              <div class="form-group"><label>Fonte de recursos Municipal</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="fonteRecursoMunicipal"></div>
              <div class="form-group"><label>Fonte de recursos Estadual</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="fonteRecursoEstadual"></div>
              <div class="form-group"><label>Fonte de recursos Federal</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="fonteRecursoFederal"></div>
            </div>

            <div class="form-row grid-cols-3">
              <div class="form-group"><label>Conta de recursos Municipal</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="contaRecursoMunicipal"></div>
              <div class="form-group"><label>Conta de recursos Estadual</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="contaRecursoEstadual"></div>
              <div class="form-group"><label>Conta de recursos Federal</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="contaRecursoFederal"></div>
            </div>

            <div class="form-row grid-cols-1">
              <div class="form-group"><label>Valor total</label><input type="text" class="form-control" placeholder="Digite aqui..." formControlName="valorTotal"></div>
              <div class="form-group"><label>Objeto</label><input type="text" class="form-control" placeholder="Digite aqui..." formControlName="objeto"></div>
            </div>

            <div class="form-row grid-cols-3">
              <div class="form-group"><label>Ocultar do portal da transparência</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="ocultarPortal"></div>
              <div class="form-group"><label>Qtde dias prestação de contas</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="qtdeDiasPrestacao"></div>
              <div class="form-group"><label>Qtde dias analise</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="qtdeDiasAnalise"></div>
            </div>

            <div class="form-row grid-cols-3">
              <div class="form-group"><label>Comissão de Monitoramento e Avaliação</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="comissaoMonitoramento"></div>
              <div class="form-group"><label>Lei Autorizadora</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="leiAutorizadora"></div>
              <div class="form-group"><label>Status</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="status"></div>
            </div>

            <div class="form-row grid-cols-4">
              <div class="form-group"><label>Responsáveis</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="responsaveis"></div>
              <div class="form-group"><label>Responsáveis Fiscalização Execução</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="responsaveisFisc"></div>
              <div class="form-group"><label>Secretaria / Diretoria</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="secretaria"></div>
              <div class="form-group"><label>Emenda Parlamentar?</label><input type="text" class="form-control" placeholder="Exemplo" formControlName="emendaParlamentar"></div>
            </div>
          </div>
        }

        @if (activeTab === 'CONTAS') {
          <div class="form-grid">
            <div class="form-row grid-cols-3 align-items-end">
              <div class="form-group">
                <label>Parcelar<span class="req">*</span></label>
                <div class="select-wrap"><select class="form-control" formControlName="parcelar"><option value="Sim">Sim</option><option value="Nao">Não</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              </div>
              <div class="form-group">
                <label>Parcelas<span class="req">*</span></label>
                <div class="select-wrap"><select class="form-control" formControlName="parcelas" [class.is-invalid]="form.get('parcelas')?.invalid && form.get('parcelas')?.touched"><option value="">Selecione</option></select><svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              </div>
              <div class="form-group" style="padding-bottom: 12px;">
                <label class="checkbox-inline">
                  <div class="checkbox">
                    <input type="checkbox" class="checkbox__input" formControlName="definirValorVencimento">
                    <span class="checkbox__box"></span>
                  </div>
                  Definir valor e vencimento
                </label>
              </div>
            </div>

            <div class="form-row grid-cols-3 mt-2">
              <div class="form-group">
                <label>Parcela</label>
                <input type="text" class="form-control disabled-bg" formControlName="parcelaDetalhe">
              </div>
              <div class="form-group">
                <label>Vencimento</label>
                <input type="text" class="form-control disabled-bg" formControlName="vencimentoDetalhe">
              </div>
              <div class="form-group">
                <label>Valor</label>
                <input type="text" class="form-control disabled-bg" formControlName="valorDetalhe">
              </div>
            </div>
          </div>
        }

        @if (activeTab === 'ANEXOS') {
          <div class="attachments-list">
            @for (anexo of anexos; track anexo.id) {
              <div class="attachment-card">
                <span class="attachment-name">{{ anexo.nome }}</span>
                <button type="button" class="btn-outline btn-outline--sm">
                  <svg viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                  Download
                </button>
              </div>
            }
          </div>
        }

      </form>
    </div>

    <div class="card-footer">
      <button class="btn-outline btn-outline--orange" routerLink="/contract-transfers">
        Voltar
      </button>

      <div class="footer-actions-right">
        <button type="button" class="btn-outline btn-outline--orange" (click)="resetForm()">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <polyline points="3 3 3 8 8 8"></polyline>
            <rect x="10" y="10" width="4" height="4" rx="1"></rect>
          </svg>
          Reiniciar formulário
        </button>

        <button type="submit" class="btn-solid btn-solid--orange" (click)="onSubmit()">
          Salvar
        </button>
      </div>
    </div>

  </div>
</div>
