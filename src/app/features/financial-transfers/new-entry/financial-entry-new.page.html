<div class="page">

  <div class="page-header">
    <h1 class="page-title">Transferências e Lançamentos Bancários</h1>
  </div>

  <div class="card">

    <div class="card-header">
      <h2 class="card-title">Novo lançamento avulso</h2>
      <p class="card-subtitle">Registre um crédito (entrada) ou débito (saída) em uma conta bancária.</p>
    </div>

    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        @if (errorMsg()) {
          <div class="error-banner" role="alert" style="margin-bottom:16px;padding:10px 14px;border-radius:8px;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;font-size:13px;">{{ errorMsg() }}</div>
        }

        <div class="form-grid">

          <div class="form-row grid-cols-3">
            <div class="form-group">
              <label>Conta bancária<span class="req">*</span></label>
              <div class="select-wrap">
                <select class="form-control" formControlName="bankAccountId" [class.is-invalid]="form.get('bankAccountId')?.invalid && form.get('bankAccountId')?.touched">
                  <option value="">Selecione</option>
                  @for (a of accounts(); track a.id) { <option [value]="a.id">{{ a.label }}</option> }
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Tipo<span class="req">*</span></label>
              <div class="select-wrap">
                <select class="form-control" formControlName="type" [class.is-invalid]="form.get('type')?.invalid && form.get('type')?.touched">
                  <option value="Credit">Crédito (entrada)</option>
                  <option value="Debit">Débito (saída)</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Categoria</label>
              <input type="text" class="form-control" placeholder="Ex.: Doações, Tarifas..." formControlName="category">
            </div>
          </div>

          <div class="form-row grid-cols-3">
            <div class="form-group">
              <label>Descrição<span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="description" [class.is-invalid]="form.get('description')?.invalid && form.get('description')?.touched">
            </div>

            <div class="form-group">
              <label>Data<span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="00/00/0000" inputmode="numeric" formControlName="date" (input)="onDateInput($event)" [class.is-invalid]="form.get('date')?.invalid && form.get('date')?.touched">
            </div>

            <div class="form-group">
              <label>Valor<span class="req">*</span></label>
              <input type="text" class="form-control" placeholder="0,00" inputmode="decimal" formControlName="amount" (input)="onMoneyInput($event)" [class.is-invalid]="form.get('amount')?.invalid && form.get('amount')?.touched">
            </div>
          </div>

          <div class="form-row grid-cols-1">
            <div class="form-group">
              <label>Observações</label>
              <input type="text" class="form-control" placeholder="Digite aqui..." formControlName="observations">
            </div>
          </div>

        </div>

      </form>
    </div>

    <div class="card-footer">
      <button class="btn-outline btn-outline--orange" routerLink="/financial-transfers">
        Voltar
      </button>

      <div class="footer-actions-right">
        <button type="button" class="btn-outline btn-outline--orange" (click)="resetForm()">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <polyline points="3 3 3 8 8 8"></polyline>
            <rect x="10" y="10" width="4" height="4" rx="1"></rect>
          </svg>
          Reiniciar formulário
        </button>

        <button type="submit" class="btn-solid btn-solid--orange" (click)="onSubmit()">
          Salvar
        </button>
      </div>
    </div>

  </div>
</div>
