<div class="page">
  <div class="page-header">
    <h1 class="page-title">Cadastro de entidade</h1>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Dados Gerais da entidade</h2>
      <p class="card-subtitle">Preencha todas as informações necessárias para cadastrar uma nova entidade/filial.</p>
    </div>

    <div class="card-body">
      <form [formGroup]="form">
        
        <div class="form-grid">
          <div class="form-row grid-cols-3">
            <div class="form-group">
              <label>CNPJ<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="cnpj" placeholder="00.000.000/0001-00" (input)="onCnpjInput($event)">
            </div>
            <div class="form-group">
              <label>Inscrição estadual</label>
              <input type="text" class="form-control" formControlName="stateRegistration" placeholder="Digite Aqui a Inscrição Estadual">
            </div>
            <div class="form-group">
              <label>Data de Constituição</label>
              <input type="date" class="form-control" formControlName="constitutionDate">
            </div>
          </div>

          <div class="form-row grid-cols-3">
            <div class="form-group">
              <label>Razão Social<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="legalName" placeholder="Digite aqui...">
            </div>
            <div class="form-group">
              <label>Nome Fantasia<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="tradeName" placeholder="Digite aqui...">
            </div>
            <div class="form-group">
              <label>Status</label>
              <div class="select-wrap">
                <select class="form-control" formControlName="status">
                  @for (opt of statusOptions; track opt.value) {
                    <option [value]="opt.value">{{ opt.label }}</option>
                  }
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>
          </div>

          <div class="form-row grid-cols-4">
            <div class="form-group">
              <label>CEP<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="zipCode" placeholder="00000-000">
            </div>
            <div class="form-group">
              <label>Endereço<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="address" placeholder="Rua, Av...">
            </div>
            <div class="form-group">
              <label>Nro<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="number" placeholder="Digite aqui...">
            </div>
            <div class="form-group">
              <label>Complemento</label>
              <input type="text" class="form-control" formControlName="complement" placeholder="Digite aqui...">
            </div>
          </div>

          <div class="form-row grid-cols-3">
            <div class="form-group">
              <label>Bairro</label>
              <input type="text" class="form-control" formControlName="district" placeholder="Digite o bairro...">
            </div>
            <div class="form-group">
              <label>Cidade<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="city" placeholder="Digite a cidade...">
            </div>
            <div class="form-group">
              <label>Estado (UF)<span class="req">*</span></label>
              <div class="select-wrap">
                <select class="form-control" formControlName="state">
                  <option value="">Selecione a UF</option>
                  @for (uf of ufOptions; track uf) {
                    <option [value]="uf">{{ uf }}</option>
                  }
                </select>
                <svg class="select-chevron" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>
          </div>

          <div class="form-row grid-cols-3">
            <div class="form-group">
              <label>Telefone principal<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="mainPhone" placeholder="(00) 00000-0000" (input)="onPhoneInput($event, 'mainPhone')">
            </div>
            <div class="form-group">
              <label>Telefone celular<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="cellPhone" placeholder="(00) 00000-0000" (input)="onPhoneInput($event, 'cellPhone')">
            </div>
            <div class="form-group">
              <label>Email do Dirigente<span class="req">*</span></label>
              <input type="email" class="form-control" formControlName="directorEmail" placeholder="Digite aqui...">
            </div>
          </div>
        </div>

        <div class="tab-container">
          <button type="button" class="tab-button" [ngClass]="{ 'active': activeTab === 'certificado' }" (click)="activeTab = 'certificado'">
            Dados do certificado digital
          </button>
          <button type="button" class="tab-button" [ngClass]="{ 'active': activeTab === 'contador' }" (click)="activeTab = 'contador'">
            Dados contador
          </button>
        </div>

        <div class="tab-content" *ngIf="activeTab === 'certificado'">
          <h3 class="section-subtitle">Dados do certificado digital</h3>
          
          <div class="form-row grid-cols-4">
            <div class="form-group">
              <label>Senha do certificado</label>
              <input type="password" class="form-control" formControlName="digitalCertPassword" placeholder="Digite aqui...">
            </div>
          </div>

          @if (uploadError()) {
            <div class="error-banner" role="alert">{{ uploadError() }}</div>
          }

          <div class="form-row grid-cols-2 mt-24">
            <div class="form-group">
              <label>Alterar certificado digital</label>
              <label class="dropzone" [class.dropzone--done]="certFileName()">
                <input type="file" accept=".pdf,.png,.jpg,.jpeg" (change)="onCertSelected($event)" hidden>
                @if (uploadingCert()) {
                  <span class="dropzone__text">Enviando...</span>
                } @else if (certFileName()) {
                  <span class="dropzone__file">{{ certFileName() }}</span>
                } @else {
                  <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                }
              </label>
            </div>
            <div class="form-group">
              <label>Alterar Logotipo da entidade</label>
              <label class="dropzone" [class.dropzone--done]="logoFileName()">
                <input type="file" accept="image/png,image/jpeg" (change)="onLogoSelected($event)" hidden>
                @if (uploadingLogo()) {
                  <span class="dropzone__text">Enviando...</span>
                } @else if (logoFileName()) {
                  <span class="dropzone__file">{{ logoFileName() }}</span>
                } @else {
                  <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                }
              </label>
            </div>
          </div>
        </div>

        <div class="tab-content" *ngIf="activeTab === 'contador'">
          <h3 class="section-subtitle">Dados do Contador</h3>
          
          <div class="form-row grid-cols-3">
            <div class="form-group">
              <label>Nome do Contador<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="accountantName" placeholder="Nome completo">
            </div>
            <div class="form-group">
              <label>CPF do Contador<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="accountantCpf" placeholder="000.000.000-00">
            </div>
            <div class="form-group">
              <label>CRC do Contador<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="accountantCrc" placeholder="UF-000000/O">
            </div>
          </div>

          <div class="form-row grid-cols-4">
            <div class="form-group">
              <label>CEP do Contador<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="accountantZipCode" placeholder="00000-000">
            </div>
            <div class="form-group">
              <label>Endereço do Contador<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="accountantAddress" placeholder="Rua, Av...">
            </div>
            <div class="form-group">
              <label>Número<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="accountantNumber" placeholder="Nº">
            </div>
            <div class="form-group">
              <label>Complemento</label>
              <input type="text" class="form-control" formControlName="accountantComplement" placeholder="Apto, Sala...">
            </div>
          </div>

          <div class="form-row grid-cols-2">
            <div class="form-group">
              <label>Telefone do Contador<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="accountantPhone" placeholder="Digite aqui...">
            </div>
            <div class="form-group">
              <label>E-mail do Contador<span class="req">*</span></label>
              <input type="email" class="form-control" formControlName="accountantEmail" placeholder="exemplo@email.com">
            </div>
          </div>

          <div class="form-row grid-cols-2">
            <div class="form-group">
              <label>Escritório de Contabilidade<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="accountantOffice" placeholder="Nome do escritório">
            </div>
            <div class="form-group">
              <label>Telefone do Escritório<span class="req">*</span></label>
              <input type="text" class="form-control" formControlName="accountantOfficePhone" placeholder="Digite aqui...">
            </div>
          </div>
        </div>

      </form>
    </div>

    <div class="card-footer">
      <button class="btn-outline btn-outline--orange" routerLink="/entity-registry">
        Voltar
      </button>

      <div class="footer-actions-right">
        <button type="button" class="btn-solid btn-solid--orange" (click)="onSubmit()">
          Salvar
        </button>
      </div>
    </div>
  </div>
</div>
